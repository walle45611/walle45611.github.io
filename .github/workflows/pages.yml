name: Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/walle-blog-cargo
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Generate static site
        run: cargo run -p site-builder --release -- --project-dir "$GITHUB_WORKSPACE" --out-dir "$GITHUB_WORKSPACE/.build/site/client"
        working-directory: ./sites/builder-rs

      - name: Run Rust tests
        run: cargo test --workspace
        working-directory: ./sites/builder-rs

      - name: Run Rust lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
        working-directory: ./sites/builder-rs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./.build/site/client --project-name=walle45611-github-io
