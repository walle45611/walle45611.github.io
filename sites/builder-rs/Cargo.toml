[workspace]
resolver = "2"
members = ["crates/site-builder"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
sha2 = "0.11"
regex = "1"
unicode-normalization = "0.1"
comrak = { version = "1.2", default-features = false }
