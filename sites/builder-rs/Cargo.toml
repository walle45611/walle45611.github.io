[workspace]
resolver = "2"
members = [
    "crates/site-builder",
    "crates/renderer-wasm",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
regex = "1"
unicode-normalization = "0.1"
comrak = { version = "0.39", default-features = false }
